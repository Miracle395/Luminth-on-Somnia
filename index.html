<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="stablex.png" type="image/png" sizes="16x16">

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

  <!-- StableX Custom CSS -->
  <link rel="stylesheet" href="stablex.css" />

  <title>Stake your assets. Earn while you sleep.</title>

  <style>
    .loading-spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #00ff90;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-left: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Ethers.js -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <img src="luminth2.png" style="width: 40px;" alt="Luminth Logo">
    </a>
    <button class="navbar-toggler" type="button" id="toggleMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
  </nav>

  <!-- Side Menu -->
  <div id="sideMenu" class="side-menu">
    <a href="javascript:void(0)" class="close-btn" id="closeMenu">&times;</a>
    <a href="#home">Home</a>
    <a href="faucet.html">Faucet</a>
    <a href="https://x.com/StableX_xyz">Community</a>
    <a href="#StableXpedia">StableXPedia</a>
    <a href="#Docs">Docs</a>
    <a href="https://x.com/stable">Stable <span style="color: yellow;">Ecosystem</span></a>
  </div>

  <!-- Intro Section -->
  <section class="staking-intro">
    <h2>Stake your assets. </br> Earn while you sleep.</h2>
    <p>Our protocol allows users to stake Stable native tokens while still keeping them liquid. Get yield, maintain flexibility and stay in control on Stable.</p>
  </section>

  <!-- Staking Card -->
  <section class="staking-card">
    <div class="staking-toggle">
      <button id="stakeTab" class="tab active">Stake</button>
      <button id="unstakeTab" class="tab">Unstake</button>
    </div>

    <h2 class="staking-heading" id="heading">Get sUSDT and Earn</h2>

    <div class="staking-form" id="stakingForm">
      <div class="form-group">
        <label id="stakeLabel">You're Staking</label>
        <div class="input-token">
          <img id="stakeImage" src="stablex.png" alt="USDT0" class="token-icon">
          <input type="number" placeholder="0.0 USDT0" id="stakeInput" min="0" step="any">
          <span class="max-btn" id="maxBtn">Max</span>
        </div>
      </div>

      <div class="form-group">
        <label>To Receive <span class="slippage">0% Slippage</span></label>
        <div class="input-token">
          <img id="receiveImage" src="stablex.png" alt="sUSDT" class="token-icon">
          <input type="text" id="receiveAmount" value="sUSDT" readonly>
        </div>
      </div>

      <button class="connect-btn" id="connectButton">Connect Wallet</button>
      <button class="stake-btn" id="stakeButton" style="display:none;">
        <span id="stakeActionText">Stake</span>
      </button>

      <p class="conversion-rate">1 USDT0 ~ 1 sUSDT</p>
      <p id="status" style="text-align:center; margin-top:0.75rem;"></p>
    </div>
  </section>

  <script>
(async () => {
  const STAKING_CONTRACT_ADDRESS = "0xE6Ff0c22417B9b66Be312950d40854bbE4487824";
  const USDT0_ADDRESS = "0x9A4ADAdFBb9d00885f8948171846ED3F080E4039";
  const STAKING_ABI = [
    "function deposit(uint256 amount) external",
    "function withdraw(uint256 amount) external",
    "function sToken() view returns (address)"
  ];
  const ERC20_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function allowance(address owner, address spender) view returns (uint256)",
    "function approve(address spender, uint256 amount) returns (bool)",
    "function decimals() view returns (uint8)",
    "function symbol() view returns (string)"
  ];
  const TARGET_CHAIN_ID_DEC = 2201;

  let provider, signer, userAddress;
  let stakingContract, usdt0Contract, sTokenContract;
  let usdtDecimals = 6, sDecimals = 6;

  const $ = id => document.getElementById(id);
  const setStatus = (txt, isError=false) => {
    const el = $('status');
    if(el){ el.textContent = txt; el.style.color = isError ? '#ff7b7b' : '#00ff90'; }
  };
  const safeLog = (...args)=>{ try{ console.log(...args); } catch(_){}; };
  const format = (bn, decimals)=>{ try{ return ethers.utils.formatUnits(bn, decimals); } catch{return '0'; } };
  const parse = (v, decimals)=>{ try{ return ethers.utils.parseUnits(v.toString(), decimals); } catch{ throw new Error('Invalid amount'); } };
  const setLoading = (loading)=>{
    [$('connectButton'), $('stakeButton'), $('maxBtn')].forEach(b=>b && (b.disabled=loading));
  };

  async function getChainId(){ 
    const hex = await window.ethereum.request({ method:'eth_chainId'});
    return parseInt(hex,16); 
  }

  async function ensureNetwork(){
    const current = await getChainId();
    if(current === TARGET_CHAIN_ID_DEC) return true;
    try{
      await window.ethereum.request({ method:'wallet_switchEthereumChain', params:[{ chainId:'0x'+TARGET_CHAIN_ID_DEC.toString(16) }] });
      return true;
    } catch(err){
      if(err.code===4902){
        await window.ethereum.request({ method:'wallet_addEthereumChain', params:[{
          chainId:'0x'+TARGET_CHAIN_ID_DEC.toString(16),
          chainName:'Stable Testnet',
          nativeCurrency:{name:'Stable',symbol:'gUSDT',decimals:6},
          rpcUrls:['https://rpc.testnet.stable.xyz'],
          blockExplorerUrls:['https://testnet.stablescan.xyz']
        }]});
        return true;
      }
      safeLog('Switch network failed:', err);
      return false;
    }
  }

  async function initContracts(){
    stakingContract = new ethers.Contract(STAKING_CONTRACT_ADDRESS, STAKING_ABI, signer);
    usdt0Contract = new ethers.Contract(USDT0_ADDRESS, ERC20_ABI, signer);
    try{
      const sAddr = await stakingContract.sToken();
      sTokenContract = new ethers.Contract(sAddr, ERC20_ABI, signer);
    } catch(err){ safeLog('sToken fetch failed', err); sTokenContract = null; }

    try{ usdtDecimals = await usdt0Contract.decimals(); } catch {}
    try{ sDecimals = sTokenContract ? await sTokenContract.decimals() : usdtDecimals; } catch {}
  }

  async function connectWallet(){
    if(!window.ethereum) return alert('MetaMask not found!');
    setLoading(true); setStatus('Connecting…');
    try{
      await window.ethereum.request({ method:'eth_requestAccounts' });
      provider = new ethers.providers.Web3Provider(window.ethereum);
      signer = provider.getSigner();
      userAddress = await signer.getAddress();

      const ok = await ensureNetwork();
      if(!ok){ setStatus('Switch to Stable Testnet (2201) in wallet.', true); setLoading(false); return; }

      await initContracts();

      $('connectButton') && ($('connectButton').style.display='none');
      $('stakeButton') && ($('stakeButton').style.display='block');

      setStatus('Connected: '+userAddress.slice(0,6)+'...'+userAddress.slice(-4));
      await updateBalances();
      attachListeners();
    } catch(err){ safeLog(err); setStatus('Failed to connect wallet.', true); }
    finally{ setLoading(false); }
  }

  function attachListeners(){
    if(!window.ethereum) return;
    window.ethereum.on('accountsChanged', ()=>setTimeout(()=>window.location.reload(),300));
    window.ethereum.on('chainChanged', ()=>setTimeout(()=>window.location.reload(),300));
  }

  async function updateBalances(){
    if(!provider||!signer) return;
    try{
      const [uBal, sBal] = await Promise.all([
        usdt0Contract.balanceOf(userAddress),
        sTokenContract ? sTokenContract.balanceOf(userAddress) : ethers.BigNumber.from('0')
      ]);
      const uStr = format(uBal, usdtDecimals), sStr = sTokenContract ? format(sBal, sDecimals) : '0';
      safeLog('Balances',{USDT0:uStr,sUSDT:sStr});
      $('stakeInput') && ($('stakeInput').placeholder=`Max: ${uStr}`);
      $('receiveAmount') && ($('receiveAmount').value = $('stakeTab')?.classList.contains('active') ? 'sUSDT' : 'USDT0');
    } catch(err){ safeLog(err); setStatus('Failed to read balances', true); }
  }

  async function ensureAllowance(amountBn){
    try{
      const allowance = await usdt0Contract.allowance(userAddress, STAKING_CONTRACT_ADDRESS);
      // Only approve if allowance is zero or less than amount
      if(allowance.gte(amountBn)) return true;
      const max = ethers.constants.MaxUint256; // Approve max for one-time
      setStatus('Requesting approval…'); setLoading(true);
      const tx = await usdt0Contract.approve(STAKING_CONTRACT_ADDRESS, max);
      setStatus('Waiting for confirmation…');
      await tx.wait();
      setStatus('Approval granted. You can now stake.');
      return true;
    } catch(err){ safeLog(err); setStatus('Approval failed.', true); return false; }
    finally{ setLoading(false); }
  }

  async function handleStakeUnstake(){
    if(!provider||!signer||!userAddress){ setStatus('Connect wallet first', true); return; }
    const raw = $('stakeInput')?.value?.trim();
    if(!raw || isNaN(raw) || Number(raw)<=0){ setStatus('Enter a valid amount', true); return; }

    const isStaking = $('stakeTab')?.classList.contains('active');
    const btn = $('stakeButton');

    try{
      setLoading(true);
      if(btn){ btn.disabled = true; const spinner = document.createElement('span'); spinner.className = 'loading-spinner'; btn.appendChild(spinner); }
      setStatus(isStaking ? 'Submitting stake transaction…' : 'Submitting unstake transaction…');

      const amtBn = parse(raw, isStaking ? usdtDecimals : sDecimals);

      if(isStaking){
        const ok = await ensureAllowance(amtBn);
        if(!ok) return;
        const tx = await stakingContract.deposit(amtBn);
        setStatus('Waiting for confirmation…'); await tx.wait();
        setStatus('Staked successfully');
      } else {
        const tx = await stakingContract.withdraw(amtBn);
        setStatus('Waiting for confirmation…'); await tx.wait();
        setStatus('Unstaked successfully');
      }

      await updateBalances();
    } catch(err){ safeLog('Transaction error:', err); setStatus('Transaction failed. Check balance or try again.', true); }
    finally{
      setLoading(false);
      if(btn){ btn.disabled=false; const spinner=btn.querySelector('.loading-spinner'); if(spinner) btn.removeChild(spinner); }
    }
  }

  async function setMaxAmount(){
    if(!provider||!signer||!userAddress){ setStatus('Connect wallet first', true); return; }
    try{
      const bal = await usdt0Contract.balanceOf(userAddress);
      $('stakeInput') && ($('stakeInput').value = format(bal, usdtDecimals));
      updateReceiveAmount();
    } catch(err){ safeLog(err); }
  }

  function updateReceiveAmount(){
    const val = parseFloat($('stakeInput')?.value) || 0;
    if($('receiveAmount')) $('receiveAmount').value = val ? val : ($('stakeTab')?.classList.contains('active')?'sUSDT':'USDT0');
  }

  function toggleTab(action){
    const isStaking = action === 'stake';
    $('stakeTab')?.classList.toggle('active', isStaking);
    $('unstakeTab')?.classList.toggle('active', !isStaking);
    $('heading') && ($('heading').textContent = isStaking ? 'Get sUSDT and Earn' : 'Unstake USDT0');
    $('stakeLabel') && ($('stakeLabel').textContent = isStaking ? "You're Staking" : "You're Unstaking");
    $('stakeInput') && ($('stakeInput').placeholder = isStaking ? '0.0 USDT0' : '0.0 sUSDT');
    $('receiveAmount') && ($('receiveAmount').value = isStaking ? 'sUSDT' : 'USDT0');
    $('stakeActionText') && ($('stakeActionText').textContent = isStaking ? 'Stake' : 'Unstake');
  }

  const attachHandlers = ()=>{
    $('connectButton')?.addEventListener('click', connectWallet);
    $('stakeButton')?.addEventListener('click', handleStakeUnstake);
    $('maxBtn')?.addEventListener('click', setMaxAmount);
    $('stakeInput')?.addEventListener('input', updateReceiveAmount);
    $('stakeTab')?.addEventListener('click', ()=>toggleTab('stake'));
    $('unstakeTab')?.addEventListener('click', ()=>toggleTab('unstake'));
    if(window.ethereum?.selectedAddress) setTimeout(()=>connectWallet().catch(()=>{}), 300);
  };

  attachHandlers();
  window.StakeUI={connectWallet, handleStakeUnstake, setMaxAmount, toggleTab, updateBalances};
})();
</script>

  <script>
    const sideMenu = document.getElementById("sideMenu");
    const toggleMenu = document.getElementById("toggleMenu");
    const closeMenu = document.getElementById("closeMenu");

    toggleMenu.addEventListener("click", () => { sideMenu.style.width = "250px"; });
    closeMenu.addEventListener("click", () => { sideMenu.style.width = "0"; });
  </script>
</body>
</html>
