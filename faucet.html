<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>USDT0 Faucet — Stable Testnet</title>

<!-- Ethers v5 -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>
:root {
  --bg: linear-gradient(135deg, #072f26, #001a14);
  --card-bg: rgba(15, 46, 38, 0.95);
  --accent: #00dfa2;
  --accent-hover: #00c08f;
  --text-light: #e6f5f0;
  --muted: #9ee8d4;
  --danger: #ff7b7b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Inter", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-light);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.card {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 40px 32px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 16px 60px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  gap: 28px;
  text-align: center;
}

h1 {
  font-size: 2rem;
  color: var(--accent);
}

p.lead {
  font-size: 1rem;
  color: var(--muted);
}

.stats {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.stat {
  flex: 1;
  background: rgba(255,255,255,0.03);
  padding: 16px;
  border-radius: 14px;
}

.stat b {
  display: block;
  margin-top: 6px;
  font-size: 1.1rem;
  color: var(--text-light);
}

.stat .label {
  font-size: 0.85rem;
  color: var(--muted);
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.buttons-horizontal {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 14px 0;
  border-radius: 14px;
  font-weight: 700;
  font-size: 1rem;
  border: none;
  cursor: pointer;
  transition: 0.2s;
  background: var(--accent);
  color: #01291F;
}

button:hover:not([disabled]) {
  background: var(--accent-hover);
}

button.secondary {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--muted);
}

button[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}

#status {
  font-size: 0.92rem;
  min-height: 22px;
  color: var(--muted);  
}
</style>
</head>
<body>

<div class="card">
  <!-- Title -->
  <h1>USDT0 Faucet</h1>
  <p class="lead">Claim <b>10 USDT0</b> every 24 hours</p>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-row">
      <div class="stat">
        <div class="label">Wallet</div>
        <b id="walletAddress">—</b>
      </div>
      <div class="stat">
        <div class="label">Chain ID</div>
        <b id="chainId">—</b>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat">
        <div class="label">Token</div>
        <b id="tokenName">—</b>
      </div>
      <div class="stat">
        <div class="label">Faucet Balance</div>
        <b id="faucetBalance">—</b>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat">
        <div class="label">Your Balance</div>
        <b id="yourBalance">—</b>
        <div class="label">Next Claim</div>
        <b id="nextClaim">—</b>
      </div>
      <div class="stat">
        <div class="label">Drip Amount</div>
        <b id="dripAmount">—</b>
        <div class="label">Cooldown</div>
        <b id="cooldownVal">—</b>
      </div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="buttons">
    <div class="buttons-horizontal">
      <button id="connectBtn">Connect Wallet</button>
      <button id="switchBtn" class="secondary" style="display:none;">Switch Network</button>
    </div>
    <button id="claimBtn" disabled>Claim 10 USDT0</button>
  </div>

  <!-- Status -->
  <div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
  console.log('Ethers version:', ethers.version);
</script>
 
<script>
/* ---------- CONFIG ---------- */
const FAUCET_ADDRESS = "0xc970bBd1b0D93684892ef5817e7Ed04Aa1272191".toLowerCase();
const FAUCET_ABI = [
	{"inputs":[],"name":"claim","outputs":[],"stateMutability":"nonpayable","type":"function"},
	{"inputs":[{"internalType":"address","name":"_token","type":"address"}],"stateMutability":"nonpayable","type":"constructor"},
	{"inputs":[{"internalType":"address","name":"owner","type":"address"}],"name":"OwnableInvalidOwner","type":"error"},
	{"inputs":[{"internalType":"address","name":"account","type":"address"}],"name":"OwnableUnauthorizedAccount","type":"error"},
	{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"user","type":"address"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"}],"name":"Claimed","type":"event"},
	{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"previousOwner","type":"address"},{"indexed":true,"internalType":"address","name":"newOwner","type":"address"}],"name":"OwnershipTransferred","type":"event"},
	{"inputs":[{"internalType":"uint256","name":"_amount","type":"uint256"}],"name":"refill","outputs":[],"stateMutability":"nonpayable","type":"function"},
	{"inputs":[],"name":"renounceOwnership","outputs":[],"stateMutability":"nonpayable","type":"function"},
	{"inputs":[{"internalType":"uint256","name":"_seconds","type":"uint256"}],"name":"setCooldown","outputs":[],"stateMutability":"nonpayable","type":"function"},
	{"inputs":[{"internalType":"uint256","name":"_amount","type":"uint256"}],"name":"setDripAmount","outputs":[],"stateMutability":"nonpayable","type":"function"},
	{"inputs":[{"internalType":"address","name":"newOwner","type":"address"}],"name":"transferOwnership","outputs":[],"stateMutability":"nonpayable","type":"function"},
	{"inputs":[],"name":"cooldown","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
	{"inputs":[],"name":"dripAmount","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
	{"inputs":[{"internalType":"address","name":"","type":"address"}],"name":"lastClaimed","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
	{"inputs":[],"name":"owner","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},
	{"inputs":[],"name":"token","outputs":[{"internalType":"contract IERC20","name":"","type":"address"}],"stateMutability":"view","type":"function"}
];
const ERC20_MIN = [
  {"constant":true,"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"balance","type":"uint256"}],"type":"function"},
  {"constant":true,"inputs":[],"name":"decimals","outputs":[{"name":"","type":"uint8"}],"type":"function"},
  {"constant":true,"inputs":[],"name":"symbol","outputs":[{"name":"","type":"string"}],"type":"function"},
  {"constant":true,"inputs":[],"name":"name","outputs":[{"name":"","type":"string"}],"type":"function"}
];

const STABLE_CHAIN_HEX = '0x899'; // 2201 decimal
const STABLE_PARAMS = {
  chainId: STABLE_CHAIN_HEX,
  chainName: 'Stable Testnet',
  nativeCurrency: { name: 'Stable', symbol: 'gUSDT', decimals: 6 },
  rpcUrls: ['https://rpc.testnet.stable.xyz'],
  blockExplorerUrls: ['https://testnet.stablescan.xyz/']
};

/* ---------- UI ELEMENTS ---------- */
const connectBtn = document.getElementById('connectBtn');
const switchBtn = document.getElementById('switchBtn');
const claimBtn = document.getElementById('claimBtn');

const walletAddrEl = document.getElementById('walletAddress');
const chainIdEl = document.getElementById('chainId');
const statusEl = document.getElementById('status');
const tokenNameEl = document.getElementById('tokenName');
const faucetBalanceEl = document.getElementById('faucetBalance');
const yourBalanceEl = document.getElementById('yourBalance');
const dripAmountEl = document.getElementById('dripAmount');
const cooldownValEl = document.getElementById('cooldownVal');
const nextClaimEl = document.getElementById('nextClaim');

/* ---------- STATE ---------- */
let provider, signer, userAddress;
let faucetContract, tokenContract;
let tokenDecimals = 6, tokenSymbol = "USDT0";
let cooldownSec = 86400;
let countdownInterval = null;

/* ---------- HELPERS ---------- */
function shorten(addr){ return addr ? `${addr.slice(0,6)}...${addr.slice(-4)}` : addr; }
function formatToken(amount, decimals){ 
  if(amount === null || amount === undefined) return "—"; 
  try { return (Number(amount) / Math.pow(10, decimals)).toLocaleString(undefined, {maximumFractionDigits: decimals}); } 
  catch(e){ return amount; } 
}
function setStatus(msg, isError=false){ 
  statusEl.textContent = msg; 
  statusEl.style.color = isError ? '#ff8b8b' : 'inherit'; 
}

/* ---------- CORE ACTIONS ---------- */
async function initAfterConnect(accounts){
  userAddress = accounts[0];
  walletAddrEl.textContent = shorten(userAddress);

  provider = new ethers.providers.Web3Provider(window.ethereum);
  signer = provider.getSigner();
  faucetContract = new ethers.Contract(FAUCET_ADDRESS, FAUCET_ABI, signer);

  try {
    const tokenAddr = (await faucetContract.token()).toLowerCase();
    tokenContract = new ethers.Contract(tokenAddr, ERC20_MIN, provider);
    tokenSymbol = await tokenContract.symbol().catch(()=>tokenSymbol);
    tokenDecimals = await tokenContract.decimals().catch(()=>6);
    const tname = await tokenContract.name().catch(()=>tokenSymbol);
    tokenNameEl.innerHTML = `<b>${tname} (${tokenSymbol})</b>`;
  } catch(e) {
    console.error("Token read failed", e);
    tokenNameEl.innerHTML = `<b>${tokenSymbol}</b>`;
  }

  await refreshAll();
  startAutoRefresh();
}

async function refreshAll(){
  try {
    const chainId = await provider.send('eth_chainId', []);
    chainIdEl.textContent = chainId;

    const [dripRaw, cooldownRaw] = await Promise.all([
      faucetContract.dripAmount().catch(()=>null),
      faucetContract.cooldown().catch(()=>null)
    ]);

    const drip = dripRaw ? dripRaw.toString() : null;
    cooldownSec = cooldownRaw ? parseInt(cooldownRaw.toString()) : 86400;

    dripAmountEl.innerHTML = `<b>${drip ? formatToken(drip, tokenDecimals) : "—"} ${tokenSymbol}</b>`;
    cooldownValEl.textContent = cooldownSec ? cooldownSec + "s" : "—";

    const faucetBalRaw = await tokenContract.balanceOf(FAUCET_ADDRESS).catch(()=>null);
    faucetBalanceEl.textContent = faucetBalRaw ? (formatToken(faucetBalRaw.toString(), tokenDecimals) + ` ${tokenSymbol}`) : "—";

    const yourBalRaw = await tokenContract.balanceOf(userAddress).catch(()=>null);
    yourBalanceEl.textContent = yourBalRaw ? (formatToken(yourBalRaw.toString(), tokenDecimals) + ` ${tokenSymbol}`) : "—";

    const lastClaimRaw = await faucetContract.lastClaimed(userAddress).catch(()=>0);
    const lastClaim = lastClaimRaw ? parseInt(lastClaimRaw.toString()) : 0;
    const nextAvailable = (lastClaim && cooldownSec) ? lastClaim + cooldownSec : 0;

    if(!nextAvailable || Math.floor(Date.now()/1000) >= nextAvailable){
      nextClaimEl.textContent = "Available now";
      claimBtn.disabled = false;
    } else {
      startCountdown(nextAvailable - Math.floor(Date.now()/1000));
      claimBtn.disabled = true;
    }

    setStatus("");
  } catch(e){
    console.error("refreshAll failed", e);
    setStatus("Error reading contract state.", true);
    claimBtn.disabled = true;
  }
}

/* ---------- COUNTDOWN ---------- */
function startCountdown(secondsLeft){
  clearInterval(countdownInterval);
  function tick(){
    if(secondsLeft <= 0){
      clearInterval(countdownInterval);
      nextClaimEl.textContent = "Available now";
      claimBtn.disabled = false;
      refreshAll();
      return;
    }
    const h = Math.floor(secondsLeft/3600);
    const m = Math.floor((secondsLeft%3600)/60);
    const s = Math.floor(secondsLeft%60);
    nextClaimEl.textContent = `${h}h ${m}m ${s}s`;
    secondsLeft--;
  }
  tick();
  countdownInterval = setInterval(tick, 1000);
}

function startAutoRefresh(){
  refreshAll();
  setInterval(()=>{ if(provider && faucetContract && userAddress) refreshAll(); }, 30_000);
}

/* ---------- NETWORK ---------- */
async function handleNetworkSwitch(){
  try {
    await window.ethereum.request({
      method: 'wallet_switchEthereumChain',
      params: [{ chainId: STABLE_CHAIN_HEX }]
    });
    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();
    faucetContract = new ethers.Contract(FAUCET_ADDRESS, FAUCET_ABI, signer);
    switchBtn.style.display = 'none';
    setStatus("Switched to Stable Testnet.");
    await refreshAll();
  } catch (switchErr) {
    if(switchErr && switchErr.code === 4902){
      try{
        await window.ethereum.request({ method: 'wallet_addEthereumChain', params:[STABLE_PARAMS] });
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        faucetContract = new ethers.Contract(FAUCET_ADDRESS, FAUCET_ABI, signer);
        switchBtn.style.display = 'none';
        setStatus("Stable Testnet added. Please reconnect if needed.");
        await refreshAll();
      }catch(addErr){
        console.error("Add chain failed", addErr);
        setStatus("Failed to add Stable Testnet.", true);
      }
    }else{
      console.error("Switch chain failed", switchErr);
      setStatus("Network switch rejected or failed.", true);
    }
  }
}

/* ---------- BUTTONS ---------- */
connectBtn.addEventListener('click', async () => {
  if(!window.ethereum){ alert("Install MetaMask!"); return; }

  try{
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    if(!accounts || accounts.length===0) throw new Error("No accounts returned");

    await initAfterConnect(accounts);

    connectBtn.textContent = "Connected";
    connectBtn.disabled = true;

    const currentChain = await provider.send('eth_chainId', []);
    if(currentChain !== STABLE_CHAIN_HEX){
      switchBtn.style.display = 'inline-block';
      await handleNetworkSwitch();
    } else { switchBtn.style.display = 'none'; }

  }catch(err){
    console.error("Connect failed", err);
    setStatus("Connection failed: " + (err.message||err), true);
  }
});

switchBtn.addEventListener('click', async ()=>{ await handleNetworkSwitch(); });

claimBtn.addEventListener('click', async ()=>{
  if(!faucetContract || !signer){ alert("Connect wallet first"); return; }
  try{
    claimBtn.disabled = true;
    setStatus("Requesting wallet signature...");
    const tx = await faucetContract.claim();
    setStatus("Transaction sent — waiting for confirmation...");
    const receipt = await tx.wait();
    const txHash = receipt.transactionHash;
    const link = document.createElement('a');
    link.href = `https://testnet.stablescan.xyz/tx/${txHash}`;
    link.text = "View on StableScan";
    link.target = "_blank"; link.className = "link";
    setStatus(""); statusEl.appendChild(link);
    setTimeout(()=>refreshAll(), 1200);
  }catch(err){
    console.error("Claim failed", err);
    let msg = (err && err.error && err.error.message) ? err.error.message : (err && err.message) ? err.message : String(err);
    if(/Wait|cooldown|claimed/i.test(msg)) msg = "You're on cooldown — wait until next claim.";
    if(/insufficient|balance/i.test(msg)) msg = "Faucet is out of tokens.";
    setStatus("Claim failed: " + msg, true);
    setTimeout(()=>refreshAll(), 1200);
  } finally { setTimeout(()=>refreshAll(), 1500); }
});

/* ---------- AUTO-DETECT ---------- */
(async function autoDetect(){
  if(window.ethereum && window.ethereum.selectedAddress){
    try{
      const accounts = [window.ethereum.selectedAddress];
      await initAfterConnect(accounts);
      connectBtn.textContent = "Connected";
      connectBtn.disabled = true;
      const currentChain = await provider.send('eth_chainId', []);
      switchBtn.style.display = currentChain!==STABLE_CHAIN_HEX ? 'inline-block' : 'none';
    }catch(e){ console.error("Auto-detect failed", e); }
  }
})();
</script>




</body>
</html>
